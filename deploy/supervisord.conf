[unix_http_server]
file=%(ENV_HOME)s/tmp/quest-tool-supervisor.sock
chmod=0700

[supervisord]
logfile=%(ENV_HOME)s/logs/quest-tool-supervisord.log
logfile_maxbytes=20MB
logfile_backups=5
pidfile=%(ENV_HOME)s/tmp/quest-tool-supervisord.pid
childlogdir=%(ENV_HOME)s/logs
nodaemon=false
minfds=1024

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_HOME)s/tmp/quest-tool-supervisor.sock

[program:quest-tool-web]
directory=%(ENV_HOME)s/htdocs/quest-tool
command=%(ENV_HOME)s/htdocs/quest-tool/.venv/bin/gunicorn config.wsgi:application --bind 127.0.0.1:8091 --workers 3 --timeout 120 --access-logfile %(ENV_HOME)s/logs/quest-tool-web-access.log --error-logfile %(ENV_HOME)s/logs/quest-tool-web-error.log
environment=HOME="%(ENV_HOME)s",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=%(ENV_HOME)s/logs/quest-tool-web-supervisor.log
redirect_stderr=true

[program:quest-tool-worker]
directory=%(ENV_HOME)s/htdocs/quest-tool
command=%(ENV_HOME)s/htdocs/quest-tool/.venv/bin/celery -A config worker --loglevel=INFO --concurrency=2 --max-tasks-per-child=500
environment=HOME="%(ENV_HOME)s",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=%(ENV_HOME)s/logs/quest-tool-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true

[program:quest-tool-beat]
directory=%(ENV_HOME)s/htdocs/quest-tool
command=%(ENV_HOME)s/htdocs/quest-tool/.venv/bin/celery -A config beat --loglevel=INFO --schedule=%(ENV_HOME)s/tmp/quest-tool-celerybeat-schedule
environment=HOME="%(ENV_HOME)s",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=%(ENV_HOME)s/logs/quest-tool-beat.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true
