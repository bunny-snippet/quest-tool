{% extends 'surveys/flow_base.html' %}

{% block title %}Please wait{% endblock %}
{% block body_class %}security-check-body{% endblock %}

{% block extra_head %}
  <script async id="verisoul-sdk" src="{{ verisoul_sdk_url }}" verisoul-project-id="{{ verisoul_project_id }}"></script>
  <script>
  (() => {
    if (window.Verisoul) return;
    const pending = [];
    const methods = {};
    const flush = () => {
      if (!Object.keys(methods).length) return;
      pending.splice(0).forEach(([method, args, resolve, reject]) => {
        try { Promise.resolve(methods[method](...args)).then(resolve, reject); }
        catch (error) { reject(error); }
      });
    };
    window.Verisoul = new Proxy(methods, {
      get(target, method) {
        if (method in target) return target[method];
        return (...args) => new Promise((resolve, reject) => pending.push([method, args, resolve, reject]));
      },
      set(target, method, value) {
        target[method] = value;
        flush();
        return true;
      },
    });
    const sdk = document.getElementById('verisoul-sdk');
    const timer = window.setInterval(flush, 40);
    sdk.addEventListener('load', () => { flush(); window.clearInterval(timer); }, {once: true});
    sdk.addEventListener('error', () => {
      window.clearInterval(timer);
      pending.splice(0).forEach(([, , , reject]) => reject(new Error('SDK unavailable')));
    }, {once: true});
  })();
  </script>
{% endblock %}

{% block content %}
<main class="security-check-page">
  <div class="silent-loader" role="status" aria-label="Loading">
    <span></span><span></span><span></span>
  </div>
  <form hidden>{% csrf_token %}</form>
</main>
{% endblock %}

{% block scripts %}
<script>
(() => {
  const endpoint = "{{ security_check_url|escapejs }}";
  const rid = "{{ attempt.rid|escapejs }}";
  const csrf = document.querySelector('[name=csrfmiddlewaretoken]').value;

  const postDecision = async (sessionId) => {
    const response = await fetch(endpoint, {
      method: 'POST',
      credentials: 'same-origin',
      headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrf},
      body: JSON.stringify({rid, session_id: sessionId || ''}),
    });
    const payload = await response.json().catch(() => ({}));
    if (payload.status === 'pending') {
      await new Promise(resolve => setTimeout(resolve, 700));
      return postDecision(sessionId);
    }
    if (payload.redirect) window.location.replace(payload.redirect);
    else throw new Error(payload.detail || 'Security verification failed.');
  };

  const getSession = async () => {
    let lastError;
    for (let attempt = 0; attempt < 3; attempt += 1) {
      try {
        const session = await window.Verisoul.session();
        if (session && session.session_id) return session.session_id;
        throw new Error('Session ID unavailable');
      } catch (error) {
        lastError = error;
        await new Promise(resolve => setTimeout(resolve, 350));
      }
    }
    throw lastError || new Error('Session ID unavailable');
  };

  (async () => {
    try {
      await postDecision(await getSession());
    } catch (error) {
      try { await postDecision(''); } catch (_) { /* Keep the loader silent. */ }
    }
  })();
})();
</script>
{% endblock %}
