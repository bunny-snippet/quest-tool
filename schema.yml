  /api/v1/sync/:
    post:
      operationId: api_v1_sync_create
      description: By default queues the same Celery task that beat runs every minute.
        Use wait=true for operational testing to run in the HTTP process and receive
        counters immediately. The sync fetches both full and cursor-paged inventory,
        deduplicates by surveyId using modifiedDate, and refreshes quota/targeting
        only for new or changed surveys.
      summary: Start an InnovateMR inventory synchronization
      parameters:
      - in: query
        name: wait
        schema:
          type: boolean
        description: Run synchronously and return the completed run summary.
      tags:
      - Synchronization
      security:
      - VendorApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncTriggerResponse'
              examples:
                SynchronousResult:
                  value:
                    run_id: 42
                    status: success
                    created: 3
                    updated: 8
                    unchanged: 110
                    closed: 2
                    detail_failures: 0
                  summary: Synchronous result
          description: ''
        '202':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
