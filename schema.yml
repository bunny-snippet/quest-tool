components:
  schemas:
    AccessFunction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 120
        name:
          type: string
          maxLength: 120
        module:
          type: string
          maxLength: 80
        description:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - module
      - name
      - updated_at
    AccessFunctionRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 120
        name:
          type: string
          minLength: 1
          maxLength: 120
        module:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
        is_active:
          type: boolean
      required:
      - code
      - module
      - name
    AccountTypeEnum:
      enum:
      - employee
      - internal_vendor
      - external_vendor
      type: string
      description: |-
        * `employee` - Employee
        * `internal_vendor` - Internal vendor
        * `external_vendor` - External vendor
    AllocationReservation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        attempt:
          type: integer
          readOnly: true
        rid:
          type: string
          readOnly: true
        vendor:
          type: integer
          readOnly: true
        client_allocation:
          type: integer
          readOnly: true
        survey_allocation:
          type: integer
          readOnly: true
          nullable: true
        survey:
          type: integer
          readOnly: true
          nullable: true
        quantity:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AllocationReservationStatusEnum'
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        finalized_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attempt
      - client_allocation
      - created_at
      - expires_at
      - finalized_at
      - id
      - quantity
      - reason
      - rid
      - status
      - survey
      - survey_allocation
      - updated_at
      - vendor
    AllocationReservationStatusEnum:
      enum:
      - reserved
      - consumed
      - released
      - expired
      type: string
      description: |-
        * `reserved` - Reserved
        * `consumed` - Consumed
        * `released` - Released
        * `expired` - Expired
    Client:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 160
        provider_code:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        company_name_match:
          type: string
          description: Current survey company label used while legacy inventory is
            mapped to this client.
          maxLength: 160
        is_active:
          type: boolean
        created_by:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        integrations:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - code
      - created_at
      - created_by
      - id
      - integrations
      - name
      - updated_at
    ClientIntegration:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        client:
          type: integer
        client_name:
