  /survey/rfg/callback:
    get:
      operationId: survey_rfg_callback_retrieve
      description: 'Called by RFG after a respondent outcome. It updates the RID attempt,
        exit IP/time, LOI and allocation state. This is not a normal admin test endpoint:
        Swagger calls will normally receive 403 because only RFG''s configured server
        IPs are trusted. Use the RFG callback preview endpoint to safely understand
        result/live codes without writing data.'
      summary: Receive a verified Research For Good result callback
      parameters:
      - in: query
        name: liveI
        schema:
          type: string
        description: RFG invalid-profile detail code
      - in: query
        name: liveP
        schema:
          type: string
        description: RFG respondent journey bit field
      - in: query
        name: liveS
        schema:
          type: string
        description: RFG security detail code
      - in: query
        name: quotaThrottle
        schema:
          type: string
        description: RFG quota throttle flag
      - in: query
        name: result
        schema:
          type: string
        description: RFG result code
        required: true
      - in: query
        name: rid
        schema:
          type: string
        description: Platform respondent ID
        required: true
      - in: query
        name: ruledOutBy
        schema:
          type: string
        description: RFG termination reason
      - in: query
        name: sesskey
        schema:
          type: string
        description: RFG session identifier
      tags:
      - RFG Callbacks
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RFGCallbackResponse'
          description: ''
