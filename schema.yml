openapi: 3.0.3
info:
  title: Survey Workspace API
  version: 1.0.0
  description: Internal API for InnovateMR survey ingestion, browsing, quotas and
    pre-screening targeting. Upstream credentials remain server-side.
paths:
  /api/v1/access/functions/:
    get:
      operationId: api_v1_access_functions_list
      summary: List configurable application functions
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Access control
      security:
      - VendorApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccessFunctionList'
          description: ''
    post:
      operationId: api_v1_access_functions_create
      summary: Create an application function
      tags:
      - Access control
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessFunctionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccessFunctionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccessFunctionRequest'
        required: true
      security:
      - VendorApiKeyAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessFunction'
          description: ''
  /api/v1/access/functions/{id}/:
    get:
      operationId: api_v1_access_functions_retrieve
      summary: Get an application function
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this access function.
        required: true
      tags:
      - Access control
      security:
      - VendorApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessFunction'
          description: ''
    put:
      operationId: api_v1_access_functions_update
      summary: Replace an application function
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this access function.
        required: true
      tags:
      - Access control
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessFunctionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccessFunctionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccessFunctionRequest'
        required: true
      security:
      - VendorApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessFunction'
          description: ''
    patch:
      operationId: api_v1_access_functions_partial_update
      summary: Update an application function
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this access function.
        required: true
      tags:
      - Access control
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccessFunctionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAccessFunctionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccessFunctionRequest'
      security:
      - VendorApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessFunction'
          description: ''
    delete:
      operationId: api_v1_access_functions_destroy
      summary: Delete an application function
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this access function.
        required: true
      tags:
      - Access control
      security:
      - VendorApiKeyAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/access/roles/:
    get:
      operationId: api_v1_access_roles_list
      summary: List roles and assigned functions
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Access control
      security:
      - VendorApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRoleList'
          description: ''
    post:
      operationId: api_v1_access_roles_create
      summary: Create a role with function permissions
      tags:
      - Access control
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RoleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoleRequest'
        required: true
      security:
      - VendorApiKeyAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
          description: ''
  /api/v1/access/roles/{slug}/:
    get:
      operationId: api_v1_access_roles_retrieve
      summary: Get a role
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Access control
      security:
      - VendorApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
          description: ''
    put:
      operationId: api_v1_access_roles_update
      summary: Replace a role and its function permissions
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Access control
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RoleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoleRequest'
        required: true
      security:
      - VendorApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
          description: ''
    patch:
      operationId: api_v1_access_roles_partial_update
      summary: Update a role or its function permissions
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Access control
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRoleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRoleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRoleRequest'
      security:
      - VendorApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
          description: ''
    delete:
      operationId: api_v1_access_roles_destroy
      summary: Delete a role
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Access control
      security:
      - VendorApiKeyAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/access/users/:
    get:
      operationId: api_v1_access_users_list
      summary: List users, roles, overrides and effective permissions
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Access control
      security:
      - VendorApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserAccessList'
          description: ''
    post:
      operationId: api_v1_access_users_create
      summary: Create an employee account
      tags:
      - Access control
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAccessRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserAccessRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserAccessRequest'
      security:
      - VendorApiKeyAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccess'
          description: ''
  /api/v1/access/users/{id}/:
    get:
      operationId: api_v1_access_users_retrieve
      summary: Get one user's effective access
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Access control
      security:
      - VendorApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccess'
          description: ''
    put:
      operationId: api_v1_access_users_update
      summary: Replace a user and access overrides
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Access control
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAccessRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserAccessRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserAccessRequest'
      security:
      - VendorApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccess'
          description: ''
    patch:
      operationId: api_v1_access_users_partial_update
      summary: Update role or per-user allow/deny overrides
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Access control
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserAccessRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserAccessRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserAccessRequest'
      security:
      - VendorApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccess'
          description: ''
    delete:
      operationId: api_v1_access_users_destroy
      summary: Delete an employee account
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Access control
      security:
      - VendorApiKeyAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/dashboard/:
    get:
      operationId: api_v1_dashboard_retrieve
      description: Returns permission-scoped KPI totals, incidence rate, immutable
        hit-time CPI revenue, client completion share, performance, outcome/device
        breakdowns and top users.
      summary: Get permission-scoped dashboard analytics
      tags:
      - Dashboard
      security:
      - VendorApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
          description: ''
  /api/v1/survey-attempts/:
    get:
      operationId: api_v1_survey_attempts_list
      description: Staff-only audit data for initiated pre-screeners, redirects, callbacks,
        IPs, measured LOI, survey country and the CPI snapshot frozen when the respondent
        entered.
      summary: List respondent survey attempts
      parameters:
      - in: query
        name: branch
        schema:
          type: array
          items:
            type: string
        description: Comma-separated organization Branch IDs or legacy labels
        explode: false
        style: form
      - in: query
        name: buyer_id
        schema:
          type: array
          items:
            type: string
        description: Comma-separated buyer/sub-client IDs
        explode: false
        style: form
      - in: query
        name: callback_from
        schema:
          type: string
          format: date-time
      - in: query
        name: callback_to
        schema:
          type: string
          format: date-time
      - in: query
        name: client
        schema:
          type: array
          items:
            type: string
        description: Comma-separated internal client IDs
        explode: false
        style: form
      - in: query
        name: company
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: country
        schema:
          type: array
          items:
            type: string
        description: Comma-separated survey country codes
        explode: false
        style: form
      - in: query
        name: entry_ip
        schema:
          type: string
      - in: query
        name: exit_ip
        schema:
          type: string
      - in: query
        name: initiated_from
        schema:
          type: string
          format: date-time
      - in: query
        name: initiated_to
        schema:
          type: string
          format: date-time
      - in: query
        name: internal_id
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: shift
        schema:
          type: array
          items:
            type: string
        description: Comma-separated organization Shift IDs or legacy labels
        explode: false
        style: form
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
        description: Comma-separated attempt statuses
        explode: false
        style: form
      - in: query
        name: sub_branch
        schema:
          type: array
          items:
            type: string
        description: Comma-separated organization Sub-branch IDs or legacy labels
        explode: false
        style: form
      - in: query
        name: survey_id
        schema:
          type: string
      - in: query
        name: user
        schema:
          type: array
          items:
            type: string
        description: Comma-separated platform user IDs
        explode: false
        style: form
      tags:
      - Survey attempts
      security:
      - VendorApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSurveyAttemptListResponseList'
          description: ''
  /api/v1/survey-attempts/{rid}/:
    get:
      operationId: api_v1_survey_attempts_retrieve
      description: Staff-only detail including captured answers and outbound supplier
        URL.
      summary: Get one respondent attempt by RID
      parameters:
      - in: path
        name: rid
        schema:
          type: string
        required: true
      tags:
      - Survey attempts
      security:
      - VendorApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyAttempt'
          description: ''
  /api/v1/survey-attempts/export/:
    get:
      operationId: api_v1_survey_attempts_export_retrieve
      description: Downloads every field associated with the currently filtered attempts,
        including user and survey identifiers, entry/exit network metadata, client
        metadata, timestamps, answers and callback audit data.
      summary: Export all filtered survey attempt data
      parameters:
      - in: query
        name: branch
        schema:
          type: string
        description: Comma-separated organization Branch IDs or legacy labels.
      - in: query
        name: buyer_id
        schema:
          type: string
        description: Comma-separated buyer/sub-client IDs.
      - in: query
        name: callback_from
        schema:
          type: string
          format: date-time
        description: Exit timestamp lower bound (ISO 8601).
      - in: query
        name: callback_to
        schema:
          type: string
          format: date-time
        description: Exit timestamp upper bound (ISO 8601).
      - in: query
        name: client
        schema:
          type: string
        description: Comma-separated internal client IDs.
      - in: query
        name: company
        schema:
          type: string
        description: Comma-separated survey company names.
      - in: query
        name: country
        schema:
          type: string
        description: Comma-separated survey country codes.
      - in: query
        name: entry_ip
        schema:
          type: string
        description: Exact entry IP address.
      - in: query
        name: exit_ip
        schema:
          type: string
        description: Exact exit IP address.
      - in: query
        name: initiated_from
        schema:
          type: string
          format: date-time
        description: Entry timestamp lower bound (ISO 8601).
      - in: query
        name: initiated_to
        schema:
          type: string
          format: date-time
        description: Entry timestamp upper bound (ISO 8601).
      - in: query
        name: internal_id
        schema:
          type: string
        description: Exact internal 14-digit project ID.
      - in: query
        name: ordering
        schema:
          type: string
        description: Sort by initiated_at, callback_at, loi_seconds or status; prefix
          - for descending.
      - in: query
        name: search
        schema:
          type: string
        description: Search RID, user, survey, IP or client metadata.
      - in: query
        name: shift
        schema:
          type: string
        description: Comma-separated organization Shift IDs or legacy labels.
      - in: query
        name: status
        schema:
          type: string
        description: Comma-separated attempt status codes.
      - in: query
        name: sub_branch
        schema:
          type: string
        description: Comma-separated organization Sub-branch IDs or legacy labels.
      - in: query
        name: survey_id
        schema:
          type: integer
        description: Exact upstream survey ID.
      - in: query
        name: user
        schema:
          type: string
        description: Comma-separated platform user IDs.
      tags:
      - Survey attempts
      security:
      - VendorApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/surveys/:
    get:
      operationId: api_v1_surveys_list
      description: Returns locally stored surveys using page-number pagination. Search
        matches project ID, upstream survey ID, survey name, country and category.
        Date filters accept ISO-8601 timestamps.
      summary: List synchronized surveys
      parameters:
      - in: query
        name: buyer_id
        schema:
          type: string
        description: Comma-separated buyer/sub-client IDs.
      - in: query
        name: client
        schema:
          type: number
        description: Internal client record ID
      - in: query
        name: client_name
        schema:
          type: array
          items:
            type: string
        description: Comma-separated allocated client names
        explode: false
        style: form
      - in: query
        name: company
        schema:
          type: array
          items:
            type: string
        description: Comma-separated supplier company names
        explode: false
        style: form
      - in: query
        name: country
        schema:
          type: array
          items:
            type: string
        description: Comma-separated country codes, e.g. US,IN
        explode: false
        style: form
      - in: query
        name: created_from
        schema:
          type: string
          format: date-time
      - in: query
        name: created_to
        schema:
          type: string
          format: date-time
      - in: query
        name: language
        schema:
          type: array
          items:
            type: string
        description: Comma-separated language codes, e.g. EN,HI
        explode: false
        style: form
      - in: query
        name: max_cpi
        schema:
          type: number
      - in: query
        name: min_cpi
        schema:
          type: number
      - in: query
        name: modified_from
        schema:
          type: string
          format: date-time
      - in: query
        name: modified_to
        schema:
          type: string
          format: date-time
      - in: query
        name: ordering
        schema:
          type: string
        description: One of source_modified_at, source_created_at, cpi, sample_size,
          completes, created_at; prefix '-' for descending.
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based result page.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Rows per page (1–100, default 20).
      - in: query
        name: search
        schema:
          type: string
        description: Free-text search across survey identifiers and descriptive fields.
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
        description: 'Comma-separated statuses: live,closed'
        explode: false
        style: form
      - in: query
        name: survey_type
        schema:
          type: string
        description: Comma-separated normalized audience types, for example B2B,B2C.
      tags:
      - Surveys
      security:
      - VendorApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSurveyListList'
          description: ''
  /api/v1/surveys/{local_id}/:
    get:
      operationId: api_v1_surveys_retrieve
      description: Looks up a survey by the platform's immutable 14-digit local_id
        and embeds current quotas and targeting questions.
      summary: Get one survey
      parameters:
      - in: path
        name: local_id
        schema:
          type: string
        required: true
      tags:
      - Surveys
      security:
      - VendorApiKeyAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyDetail'
          description: ''
  /api/v1/surveys/{local_id}/quotas/:
    get:
      operationId: api_v1_surveys_quotas_list
      description: Returns the most recently synchronized, provider-normalized quota
        data for this survey.
      summary: List a survey's quotas
      parameters:
      - in: query
        name: buyer_id
        schema:
          type: array
          items:
            type: string
        description: Comma-separated provider buyer/sub-client IDs
        explode: false
        style: form
      - in: query
        name: client
        schema:
          type: number
        description: Internal client record ID
      - in: query
        name: client_name
        schema:
          type: array
          items:
