tags:
- name: Surveys
  description: Browse locally synchronized survey inventory.
- name: Survey details
  description: Quota and pre-screening targeting captured from InnovateMR.
- name: Survey attempts
  description: Staff-only respondent attempt, callback, IP and LOI audit records.
- name: Dashboard
  description: Permission-aware operational analytics, client contribution and performance
    trends.
- name: User hits
  description: Date-wise user hits and completes aggregated by respondent device.
- name: Synchronization
  description: Trigger and audit upstream inventory synchronization.
- name: Access control
  description: Dynamic roles, function assignments and per-user access overrides.
- name: Vendors & allocations
  description: UAT client scope, vendor commercial policy and quantity allocation
    APIs.
- name: Organization hierarchy
  description: Branch, Sub-branch, Shift, team assignment and unit-level client visibility
    APIs.
- name: Client API catalog
  description: Search configured clients by stable name/code and inspect their available
    provider operations without database IDs.
- name: InnovateMR APIs
  description: Every documented InnovateMR Supplier API, grouped for direct testing
    with server-side credentials and guarded live mutations.
- name: RFG APIs
  description: Every documented Research For Good LiveAlert command using server-generated
    HMAC authentication.
- name: RFG Callbacks
  description: Research For Good callback contract and safe result-code interpretation
    tools.
